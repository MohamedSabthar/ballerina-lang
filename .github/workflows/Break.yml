name: Check breaking changes in ballerinax connectors
on: 
  workflow_dispatch
  
jobs:
  build_distribution_with_changes:
    runs-on: ubuntu-latest
    
    steps:
#       - name: Checkout current repository
#         uses: actions/checkout@v2
        
      - name: Set up JDK 11
        uses: actions/setup-java@v2
        with:
          distribution: 'adopt'
          java-version: '11'
          
#       - name: Initialize sub-modules
#         run: git submodule update --init
          
#       - name: Build current repo with Gradle
#         env:
#           packageUser: ${{ github.actor }}
#           packagePAT: ${{ secrets.GITHUB_TOKEN }}
#           devCentralToken: ${{ secrets.BALLERINA_DEV_CENTRAL_ACCESS_TOKEN }}
#           TEST_MODE_ACTIVE: true
#         run: ./gradlew clean build publishToMavenLocal --stacktrace --scan --console=plain --continue
        
      - name: Checkout distribution repository
        uses: actions/checkout@v2
        with:
          repository: ballerina-platform/ballerina-distribution
          
      - name: Build distribution with Gradle
        env:
          packageUser: ${{ github.actor }}
          packagePAT: ${{ secrets.GITHUB_TOKEN }}
          devCentralToken: ${{ secrets.BALLERINA_DEV_CENTRAL_ACCESS_TOKEN }}
          TEST_MODE_ACTIVE: true
        run: |
          ./gradlew build  -x test
          
      - name: Create linux-deb distribution installer
        id: run_installers_deb
        run: |
          cd installers/linux-deb
          ./build-ballerina-linux-deb-x64.sh -v ${{ steps.project-version.outputs.version }} -p ./../../ballerina/build/distributions
          echo "Created linux-deb successfully"
      
      - name: Archive Linux deb installer
        uses: actions/upload-artifact@v2
        with:
          name: Linux Installer deb
          path: installers/linux-deb/target/ballerina-*-linux-x64.deb
        
        
        
      
