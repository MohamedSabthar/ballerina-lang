name: Trigger ballerinax connector build
on:
  workflow_dispatch:
    inputs:
      artifact:
        description: "Artifact ID"
        required: true
      version:
        description: "Artifact version"
        required: true
      short_version:
        description: "Artifact short version"
        required: true

jobs:
  trigger_repository_disptach_in_ballerinax:
    strategy:
      fail-fast: false
      matrix:
        modules: [twitter]
    name: Trigger ballerinax connector builds
    runs-on: ubuntu-latest
    steps:

      - name: disptch build request
        run: |
          curl --request \
          POST 'https://api.github.com/repos/mohamedsabthar/module-ballerinax-${{matrix.modules}}/dispatches' \
          --header 'Accept: application/vnd.github.v3+json' \
          --header 'Content-Type: application/json' \
          --header 'Authorization: token ${{secrets.BALLERINA_BOT_TOKEN}}' \
          --data-raw '{
              "event_type":"check_connector_for_breaking_changes",
              "client_payload":{
                "artifact":${{github.event.inputs.artifact}},
                "version":${{github.event.inputs.version}},
                "short_version":${{github.event.inputs.short_version}}
                }
          }'
