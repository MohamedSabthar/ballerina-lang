  check_stdlib:
    name: Check for breaking changes in level 8 stdlib modules
    strategy:
      matrix:
        stdlibs: [java.jdbc, mssql, mysql, oracledb, postgresql]
    runs-on: ubuntu-latest
    needs: ubuntu_build
    steps:

      - name: checkout connector
        uses: actions/checkout@v2
        with:
          repository: ballerina-platform/module-ballerinax-${{matrix.stdlibs}}

      - name: Set up JDK 11
        uses: actions/setup-java@v1
        with:
          java-version: 11

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Dowload archived distribution
        uses: actions/download-artifact@v3
        with:
          name: test-distriubtion

      - name: Unzip distribution zip
        run: |
          unzip *SNAPSHOT-swan-lake-linux.zip -d ./distribution
          ls ./distribution

      - name: Check bal command
        run: |
          chmod +x ./distribution/*linux/bin/bal
#          ./distribution/*linux/bin/bal -v
      
      - name: Set bal path
        run: | 
          cd ./distribution/*linux/bin
          echo $(pwd) >> $GITHUB_PATH
          bal -v

      - name: build stdlib
        run: ./gradlew clean build


